<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Gyaan - Premium Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #090e17;
            --card-bg: #111827;
            --gold: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --tg-color: #0088cc;
            --wa-color: #25D366;
            --yt-color: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at top left, rgba(212, 175, 55, 0.03), transparent 50%),
                radial-gradient(circle at bottom right, rgba(0, 136, 204, 0.03), transparent 50%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px; 
            width: 100%;
            padding: 15px 15px; 
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }

        /* --- Animations --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-item {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Staggered Delays for elements */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        /* 1. Header */
        header {
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(212,175,55,0.5);
            object-fit: cover;
            margin-bottom: 5px;
            transition: transform 0.3s ease;
        }
        .logo:hover { transform: scale(1.05) rotate(5deg); }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        
        .brand-subtitle {
            font-size: 0.75rem;
            color: #a0a0a0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Generic 3D Hover & Active State */
        .btn-3d {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
        }
        .btn-3d:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }
        .btn-3d:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5) !important;
        }

        /* 2. Private Student Button (Green 3D Pill) */
        .btn-private-special {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #128C7E, #25D366);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            /* 3D Shadows: Outer Drop + Inner Top Highlight + Inner Bottom Dark */
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3), 
                        inset 0 2px 0 rgba(255,255,255,0.4), 
                        inset 0 -3px 0 rgba(0,0,0,0.2);
            border: 1px solid #107c6f;
        }

        /* 3. Social Row */
        .social-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-social-sm {
            text-decoration: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            background: linear-gradient(180deg, #1f2937, #111827);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-social-sm.ig { color: #ff5e8e; }
        .btn-social-sm.fb { color: #4b93ff; }

        /* 4. YouTube Row */
        .yt-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-yt {
            background: linear-gradient(180deg, rgba(30,10,10,1), rgba(15,5,5,1));
            border: 1px solid rgba(255, 0, 0, 0.2);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,80,80,0.2);
        }

        .btn-yt i { font-size: 1.4rem; color: var(--yt-color); text-shadow: 0 0 8px rgba(255,0,0,0.5); }
        .btn-yt span { font-size: 0.65rem; font-weight: 600; text-align: left; line-height: 1.2; }

        /* 5. LMS Portal Button (Purple 3D) */
        .btn-lms {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            background: linear-gradient(135deg, #6b46c1 0%, #8b5cf6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 14px;
            box-shadow: 0 6px 15px rgba(139, 92, 246, 0.3), 
                        inset 0 2px 0 rgba(255,255,255,0.3), 
                        inset 0 -3px 0 rgba(0,0,0,0.2);
            border: 1px solid #5a38a3;
        }

        .lms-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lms-content i {
            font-size: 1.5rem;
            color: #fff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .lms-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .lms-text-main {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        .lms-text-sub {
            font-size: 0.65rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* 6. List Container (3D Cards View) */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); /* Inner depth for container */
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: linear-gradient(180deg, #1f2937, #111827);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            /* Raised card effect */
            box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .list-item:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .list-title {
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e5e7eb;
        }
        .list-title i { color: var(--gold); font-size: 0.9rem; width: 16px; text-align: center; }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-size: 0.9rem;
            /* 3D button effect for icons */
            background: linear-gradient(135deg, #2d3748, #1a202c);
            box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .icon-btn.tg:hover { background: var(--tg-color); border-color: var(--tg-color); box-shadow: 0 0 10px var(--tg-color); }
        .icon-btn.wa:hover { background: var(--wa-color); border-color: var(--wa-color); box-shadow: 0 0 10px var(--wa-color); }
        
        .icon-btn:active {
            transform: scale(0.9);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>
