<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Gyaan - Premium Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #050a15;
            --card-bg: rgba(255, 255, 255, 0.04);
            --gold: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --tg-color: #0088cc;
            --wa-color: #25D366;
            --yt-color: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at top, rgba(212, 175, 55, 0.05), transparent 40%),
                radial-gradient(circle at bottom, rgba(0, 136, 204, 0.05), transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px; /* Thinner for mobile perfect fit */
            width: 100%;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px; /* Tightened gaps to fit in one page */
        }

        /* 1. Header (Logo + Title) */
        header {
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            object-fit: cover;
            margin-bottom: 5px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.1;
        }
        
        .brand-subtitle {
            font-size: 0.75rem;
            color: #a0a0a0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 2. Private Student Button */
        .btn-private-special {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #128C7E, #25D366);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            animation: pulseSpecial 2s infinite;
        }

        /* 3. Insta + Facebook Row */
        .social-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social-sm {
            text-decoration: none;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-social-sm.ig { color: #E1306C; }
        .btn-social-sm.fb { color: #1877F2; }

        /* 4. YouTube Row */
        .yt-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-yt {
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-yt i { font-size: 1.5rem; color: var(--yt-color); }
        .btn-yt span { font-size: 0.7rem; font-weight: 600; text-align: left; line-height: 1.2; }

        /* 5. Horizontal List for Universities */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 10px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.02);
            transition: all 0.2s;
        }

        .list-item:hover {
            border-color: rgba(212, 175, 55, 0.3);
        }

        .list-title {
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-title i { color: var(--gold); font-size: 1rem; width: 15px; text-align: center; }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        
        .icon-btn:hover { transform: scale(1.1); }
        .icon-btn.tg { background: rgba(0, 136, 204, 0.15); border: 1px solid var(--tg-color); color: var(--tg-color); }
        .icon-btn.wa { background: rgba(37, 211, 102, 0.15); border: 1px solid var(--wa-color); color: var(--wa-color); }

        /* Highlight specific item */
        .highlight-item {
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(212, 175, 55, 0.05);
        }
        .highlight-item .list-title { color: var(--gold); font-weight: 600; }

        @keyframes pulseSpecial {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
    </style>
</head>
<body>

</body>
</html>
