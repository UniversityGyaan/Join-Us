<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9281139746143386"
     crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>University Gyaan - Notice</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#090e17;
    color:#fff;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
    text-align:center;
}

.logo{
    width:75px;
    height:75px;
    border-radius:50%;
    border:2px solid #D4AF37;
    object-fit:cover;
    box-shadow:0 5px 20px rgba(212,175,55,.25);
    margin-bottom:12px;
}

.brand{
    font-family:'Playfair Display',serif;
    font-size:28px;
    background:linear-gradient(135deg,#BF953F,#FCF6BA,#B38728,#FBF5B7,#AA771C);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:25px;
}

.notice-card{
    background:linear-gradient(180deg,#1b2433,#111827);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.notice-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:10px;
}

.notice-text{
    color:#c7cbd3;
    font-size:13px;
    line-height:1.6;
}

.ad-box{
    margin:22px 0;
    min-height:120px;
    border:1px dashed rgba(212,175,55,.35);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:12px;
}

.continue-btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background:linear-gradient(135deg,#BF953F,#D4AF37,#AA771C);
    color:#111;
    font-size:15px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(212,175,55,.25);
}

.continue-btn:active{
    transform:translateY(2px);
}

.footer{
    margin-top:18px;
    color:#777;
    font-size:11px;
}
</style>
</head>

<body>

<div class="container">

    <img src="logo.jpg" class="logo" alt="University Gyaan">

    <div class="brand">University Gyaan</div>

    <div class="subtitle">PREMIUM EDUCATIONAL HUB</div>

    <div class="notice-card">

        <div class="notice-title">
            📢 Important Notice
        </div>

        <div class="notice-text">
            नीचे दिए गए बटन से Original Notice / Official PDF देखें।
        </div>

        <div class="ad-box">
            Advertisement Area
        </div>

        <a href="https://cdn.ccsuniversity.ac.in/public/pdf/2026/10/Swachta,%20Date-03-10-2026_0001_compressed.pdf"
           target="_blank"
           class="continue-btn">
            Continue to Official Notice →
        </a>

    </div>

    <div class="footer">
        © University Gyaan
    </div>

</div>

</body>
</html>
